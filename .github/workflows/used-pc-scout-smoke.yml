name: Used PC scout smoke

on:
  push:
    branches:
      - feat/used-pc-salvage-scout
    paths:
      - "campaigns/used_pc_scout/**"
      - "tests/campaigns/test_used_pc_scout.py"
      - ".github/workflows/used-pc-scout-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Focused unit tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/campaigns/test_used_pc_scout.py
      - name: Syntax gate
        run: |
          python -m py_compile             campaigns/used_pc_scout/scoring.py             campaigns/used_pc_scout/marketplaces.py             campaigns/used_pc_scout/scout.py             campaigns/used_pc_scout/run.py
